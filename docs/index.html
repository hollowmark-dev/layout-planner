<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>什器レイアウト検討</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="toolbar">
  <span class="brand">什器レイアウト</span>

  <div class="tb-group">
    <button id="btn-open-pdf" title="背景にする図面PDFを読み込みます">PDFを開く</button>
    <button id="btn-open-project" title="保存したプロジェクトを開きます">開く</button>
    <div class="menu">
      <button id="btn-save-menu">保存 ▾</button>
      <div class="menu-body" data-menu="save">
        <button data-save="full">図面込みで保存（推奨）</button>
        <button data-save="lite">配置のみ保存（軽量）</button>
      </div>
    </div>
    <div class="menu">
      <button id="btn-export-menu">書き出し ▾</button>
      <div class="menu-body" data-menu="export">
        <button data-export="pdf">印刷用PDF…</button>
        <button data-export="png">PNG画像</button>
        <button data-export="csv">什器数量表（CSV）</button>
      </div>
    </div>
  </div>

  <div class="tb-group">
    <button id="btn-calibrate" title="図面上の既知寸法を使って縮尺を決めます">縮尺較正</button>
    <span id="scale-indicator" class="pill pill-warn">縮尺 未設定</span>
  </div>

  <div class="tb-group" id="tools">
    <button data-tool="select" class="active" title="V">選択</button>
    <button data-tool="measure" title="M：2点間の距離を測ります">計測</button>
    <button data-tool="dim" title="D：寸法線を記入します">寸法線</button>
    <button data-tool="text" title="T：文字を記入します">文字</button>
  </div>

  <div class="tb-group">
    <label class="chk"><input type="checkbox" id="chk-snap-grid" checked> グリッド</label>
    <label class="chk"><input type="checkbox" id="chk-snap-edge" checked> 吸着</label>
    <button id="btn-aisle" title="什器同士の隙間が基準未満の箇所を探します">通路チェック</button>
  </div>

  <div class="tb-group tb-right">
    <button id="btn-undo" title="Ctrl+Z" disabled>↶</button>
    <button id="btn-redo" title="Ctrl+Y" disabled>↷</button>
    <button id="btn-zoom-fit" title="全体が見えるように表示します">全体表示</button>
    <button id="btn-help" title="使い方">?</button>
  </div>
</header>

<main>
  <!-- 左：什器パレット -->
  <aside id="palette">
    <div class="pane-head">
      <input type="search" id="palette-search" placeholder="什器を検索（例：机、書庫）">
    </div>
    <div id="palette-list" class="pane-body"></div>
    <div class="pane-foot">
      <button id="btn-add-template" class="wide">＋ 自社什器を登録</button>
      <div class="row">
        <button id="btn-export-templates" class="link">書き出し</button>
        <button id="btn-import-templates" class="link">読み込み</button>
      </div>
    </div>
  </aside>

  <!-- 中央：キャンバス -->
  <div id="stage-wrap">
    <div id="stage"></div>
    <div id="empty-state">
      <h2>図面PDFを読み込んでください</h2>
      <p>読み込んだPDFはこのブラウザの中だけで処理されます。<br>サーバーへ送信されることはありません。</p>
      <button id="btn-open-pdf-2" class="primary">PDFを開く</button>
      <p class="sub">保存したプロジェクトを開くこともできます。</p>
      <p class="sub">はじめてなら <button id="btn-sample" class="link">サンプル図面で試す</button></p>
    </div>
    <div id="hint"></div>
    <div id="statusbar">
      <span id="st-coord">—</span>
      <span id="st-zoom">100%</span>
      <span id="st-count">0点</span>
    </div>
  </div>

  <!-- 右：情報パネル -->
  <aside id="side">
    <section class="pane">
      <h3>プラン<button id="btn-add-plan" class="mini" title="今のプランを複製して新しい案を作ります">＋複製</button></h3>
      <div id="plan-tabs"></div>
      <label class="chk"><input type="checkbox" id="chk-ghost"> 他案を重ねて表示</label>
    </section>

    <section class="pane" id="pane-inspector">
      <h3>プロパティ</h3>
      <div id="inspector"><p class="muted">什器を選ぶとここに寸法や角度が出ます。</p></div>
    </section>

    <section class="pane">
      <h3>レイヤー<button id="btn-add-layer" class="mini">＋</button></h3>
      <div id="layer-list"></div>
    </section>

    <section class="pane" id="pane-check">
      <h3>通路チェック</h3>
      <label class="field">最小通路幅
        <span class="unit-input"><input type="number" id="aisle-min" value="800" step="50" min="0"><span>mm</span></span>
      </label>
      <div id="check-result"><p class="muted">「通路チェック」を押すと、隙間が基準未満の箇所を探します。</p></div>
    </section>
  </aside>
</main>

<input type="file" id="file-pdf" accept="application/pdf" hidden>
<input type="file" id="file-project" accept=".json,application/json" hidden>
<input type="file" id="file-templates" accept=".json,application/json" hidden>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="vendor/konva.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
